services:
  db:
    container_name: portfolio-manager-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: portfolio_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
